<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Log in</title>
    <link rel="icon" type="image/png" href="stripe.png">
    <link rel="apple-touch-icon" href="stripe.png">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="breadcrumb-bar">
        <a href="C:\Users\SOSO\Downloads\Bilbasen\BMW 330i M-Sport  2019\payment/payment.html" class="back-link"> < Back </a>
    </div>
    <div class="container">
        <!-- Logo -->
        <div class="logo">stripe</div>

            <!-- Titre -->
            <h1>Log in to your account</h1>

            <form>
                <!-- Champ E-mail -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <!-- Champ Mot de passe -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="https://dashboard.stripe.com/reset" class="forgot-link">Forgot password ?</a>
                    </div>
                    <input type="password" id="password" required>
                </div>

                <!-- Se souvenir de moi -->
                <label class="checkbox-container">
                    <input type="checkbox" checked>
                    Remember me on this device
                </label>

                <!-- Bouton Connexion -->
                <button type="submit" class="btn-submit">Connexion</button>

                <!-- Séparateur -->
                <div class="separator">Or log in with</div>

                <!-- Boutons Tiers -->
                <button type="button" class="btn-social">
                    <!-- Icône Google simple -->
                    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.18C.43 8.13 0 9.87 0 12s.43 3.87 1.18 5.39l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.61l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
                    Google
                </button>

                <button type="button" class="btn-social">
                    <!-- Icône Clé d'accès -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="#635bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                    Passkey
                </button>

                <button type="button" class="btn-social">
                    <!-- Icône SSO -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="#635bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    SSO
                </button>

                <!-- Créer un compte -->
                <div class="signup-box">
                    New to Stripe ? <a href="https://dashboard.stripe.com/register">Create an account</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
