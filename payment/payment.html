<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Modal</title>
    <link rel="icon" type="image/png" href="lock.jpg">
    <link rel="apple-touch-icon" href="lock.jpg">

    <a href="#" class="pay-link autres">
